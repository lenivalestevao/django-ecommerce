{% extends "shop/base.html" %}
{% block title %}Track an order | {{ SHOP.name }}{% endblock %}
{% block content %}
    <h1>Track an order</h1>
    <form method="post" action="{% url 'track' %}" class="card pad narrow">
        {% csrf_token %}
        {% include "shop/partials/field.html" with field=form.number %}
        {% include "shop/partials/field.html" with field=form.email %}
        <button class="btn" type="submit">Find my order</button>
    </form>
{% endblock %}
