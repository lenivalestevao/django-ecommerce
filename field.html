<div class="field">
    {% if field.field.widget.input_type == 'radio' %}
        <span>{{ field.label }}</span>
        {{ field }}
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<small class="hint">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
